# Access Transformers - NeoForge's supported way to widen access to vanilla members.
# Auto-detected from this path (see the commented-out `accessTransformers` line in build.gradle).
#
# Both entries exist for the editor's syntax highlighting (DebugEditBox): drawing the script in
# more than one color means reimplementing MultiLineEditBox#renderContents, and that needs the same
# text/cursor/selection state vanilla's own version reads. Everything else it uses is already public
# on MultilineTextField (cursor(), iterateLines(), getSelected(), hasSelection(), value()) - only the
# field holding it and the record it hands back are not. Reading vanilla's own state this way keeps
# the cursor and selection exactly where vanilla puts them, instead of tracking them separately and
# drifting out of sync with its key handling.

# The MultilineTextField every MultiLineEditBox delegates its text state to.
public net.minecraft.client.gui.components.MultiLineEditBox textField

# The (begin, end) index pair iterateLines()/getSelected() return - the class is public, this record
# nested inside it is not.
public net.minecraft.client.gui.components.MultilineTextField$StringView

# Automated fishing (cast_line()/reel_in(), see LiveDroneApi): rather than reimplementing the bite
# timing/bobber physics, the drone reads vanilla's own FishingHook state directly - the exact fields
# vanilla's own client rendering reads to decide when to show the splash animation. FishingRodItem's
# actual cast/reel logic is called unmodified (via a real FakePlayer holding a real rod); only these
# two read-only signals need widening.

# The synced "a bite is happening right now" flag (DATA_BITING mirrors this into entity data for
# client rendering, but the private field itself is simpler to read than the accessor indirection).
public net.minecraft.world.entity.projectile.FishingHook biting

# Which phase the hook is in (FLYING/BOBBING/HOOKED_IN_ENTITY) - is_bobber_bobbing() checks for
# BOBBING specifically. Both the field and the package-private enum it holds need widening.
public net.minecraft.world.entity.projectile.FishingHook currentState
public net.minecraft.world.entity.projectile.FishingHook$FishHookState
